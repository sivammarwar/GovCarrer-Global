    <!--
      PRECONNECT — only Supabase (with crossorigin for authenticated CORS).

      ipapi.co REMOVED entirely:
      - Lighthouse keeps flagging it as "Unused preconnect. Check that the
        crossorigin attribute is used properly" regardless of whether we
        include or omit the crossorigin attribute.
      - ipapi.co is now outside the critical path (the React Query cache
        means the fetch fires after hydration, not during initial load).
      - Removing it stops Lighthouse from penalising us for it.
    -->
    <link rel="preconnect" href="https://fxzwlkhwfvydntrgqabs.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://fxzwlkhwfvydntrgqabs.supabase.co" />

    <!--
      CRITICAL CSS — inlined to give the browser enough to paint the first
      frame before the Vite-generated CSS file downloads.

      NOTE: We removed the previous `<link rel="stylesheet" media="print">` hack
      because Vite hashes the CSS filename on every build (index-B_44UeMI.css
      became index-zsq4kV4T.css), so the hardcoded path was loading the wrong
      file and the real CSS was still injected by Vite's <script> normally —
      meaning we had TWO CSS loads instead of one.

      The correct approach for a Vite app is to let Vite inject the CSS link
      normally (it does this via the <script type="module"> tag below), and only
      inline the tiny subset of critical styles here. Vite's injected CSS is
      NOT render-blocking in modern browsers when loaded alongside the module
      script — the browser can parse HTML while the CSS and JS download in
      parallel.

      These inlined rules are the minimum for a stable, correct first paint:
    -->
    <style>
      *,*::before,*::after{box-sizing:border-box}
      html{overflow-x:hidden;scroll-behavior:smooth}
      body{
        margin:0;overflow-x:hidden;
        background-color:#f0f3f8;
        font-family:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
        -webkit-font-smoothing:antialiased;
      }
      #root{width:100%;min-height:100vh}
      /* Prevent flash of unstyled sticky header */
      body>div>div{min-height:100vh}
    </style>

    <!-- Google Fonts — non-blocking -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" /></noscript>

    <!--
      AdSense — deferred until browser is idle.
      requestIdleCallback fires after main thread is free, so it never
      blocks FCP or LCP. Falls back to 2s setTimeout for Safari.
    -->
    <script>
      function loadAdSense() {
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7027616987791044';
        s.crossOrigin = 'anonymous';
        document.head.appendChild(s);
      }
      if ('requestIdleCallback' in window) {
        requestIdleCallback(loadAdSense, { timeout: 4000 });
      } else {
        window.addEventListener('load', function () { setTimeout(loadAdSense, 2000); });
      }
    </script>

  <body>
    <div id="root"></div>
    <!-- Vite injects the hashed CSS <link> and the module script automatically -->
    <script type="module" src="/src/main.tsx"></script>
